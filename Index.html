<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드림 유스 오케스트라</title>
<meta name="theme-color" content="#2f4f6f">
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1f2a33; --sub:#6b7680; --line:#e4e0d6; --main:#2f4f6f; --ok:#2e7d4f; --warn:#b25e09; --bad:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-size:16px; line-height:1.5; }
  header { background:var(--main); color:#fff; padding:16px; }
  header h1 { font-size:18px; margin:0; }
  header p { margin:2px 0 0; font-size:14px; opacity:.85; }
  nav { display:flex; gap:4px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto; position:sticky; top:0; z-index:5; }
  nav button { flex:0 0 auto; border:0; background:none; padding:8px 12px; border-radius:20px; font-size:15px; color:var(--sub); }
  nav button.on { background:var(--main); color:#fff; }
  main { padding:12px 16px 40px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:17px; margin:0 0 6px; }
  .card h3 { font-size:15px; margin:12px 0 6px; }
  .sub { color:var(--sub); font-size:14px; }
  .alert { background:#fff4e5; border:1px solid #f3c98b; color:#7a4300; border-radius:8px; padding:8px 10px; font-size:14px; margin:8px 0; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; background:#eef1f4; color:var(--sub); margin-left:4px; }
  .badge.ok { background:#e6f4ec; color:var(--ok); } .badge.warn { background:#fdf0e1; color:var(--warn); } .badge.bad { background:#fbe9e7; color:var(--bad); }
  .btn { border:1px solid var(--main); background:var(--main); color:#fff; border-radius:8px; padding:10px 14px; font-size:15px; }
  .btn.line { background:#fff; color:var(--main); }
  .btn:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, textarea { font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; }
  label { font-size:14px; color:var(--sub); display:block; margin:8px 0 4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; }
  .slot { border-top:1px solid var(--line); padding:8px 0; }
  .slot:first-of-type { border-top:0; }
  .names { font-size:14px; }
  .mine { font-weight:700; color:var(--main); }
  .att { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
  .seg { display:flex; gap:4px; }
  .seg button { border:1px solid var(--line); background:#fff; border-radius:6px; padding:6px 10px; font-size:14px; }
  .seg button.on[data-v="출석"] { background:var(--ok); color:#fff; border-color:var(--ok); }
  .seg button.on[data-v="결석"] { background:var(--bad); color:#fff; border-color:var(--bad); }
  .seg button.on[data-v="지각"] { background:var(--warn); color:#fff; border-color:var(--warn); }
  #pin { max-width:360px; margin:60px auto; padding:0 16px; text-align:center; }
  #pin input { text-align:center; font-size:24px; letter-spacing:8px; margin:12px 0; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1f2a33; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; display:none; max-width:90%; z-index:10; }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="pin">
  <h1 style="font-size:20px">드림 유스 오케스트라</h1>
  <p class="sub" id="pinMsg">등록한 휴대폰 번호 뒷 4자리를 입력해 주세요.</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <label style="text-align:left"><input type="checkbox" id="remember" checked style="width:auto"> 이 기기 등록하기 (다음부터 번호 없이 열려요)</label>
  <p class="sub" style="text-align:left;font-size:13px">여러 사람이 함께 쓰는 컴퓨터라면 체크를 빼 주세요.</p>
  <button class="btn" id="pinBtn" style="width:100%;margin-top:8px">들어가기</button>
</div>
<div id="app" class="hidden">
  <header><h1>드림 유스 오케스트라</h1><p id="who"></p></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script>
/* ▼▼▼ 여기에 Apps Script 웹 앱 주소(…/exec)를 붙여 넣으세요 ▼▼▼ */
const API = 'https://script.google.com/macros/s/AKfycbzUncHgcB9ao0Zicc7q3-k8IvvIsKJHHHQ58U8VmCE4LVohtlED_S-69t2hOlDeXAa5Fw/exec';
/* ▲▲▲ ▲▲▲ */

const KEY = new URLSearchParams(location.search).get('k') || '';
const DEVKEY = 'dyo_dev_' + KEY.slice(0, 12);
function devGet() { try { return localStorage.getItem(DEVKEY) || ''; } catch (e) { return ''; } }
function devSet(v) { try { v ? localStorage.setItem(DEVKEY, v) : localStorage.removeItem(DEVKEY); } catch (e) {} }
const DEV = devGet();
let PIN = '', V = null, TAB = '', NEWDEV = false;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Number(n || 0).toLocaleString('ko-KR') + '원';
const md = s => { const p = String(s).split('-'); return p.length === 3 ? Number(p[1]) + '월 ' + Number(p[2]) + '일' : s; };
const ym = s => { const p = String(s).split('-'); return p.length === 2 ? p[0] + '년 ' + Number(p[1]) + '월' : s; };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
async function call(fn, ...args) {
  let r;
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, k: KEY, cred: PIN, args: args }) });
    r = await res.json();
  } catch (e) {
    throw new Error('연결이 잘 안 돼요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  }
  if (!r.ok) throw new Error(r.error);
  return r.data;
}
function deviceLabel() {
  const u = navigator.userAgent;
  const os = /iPhone|iPad/.test(u) ? 'iPhone/iPad' : /Android/.test(u) ? 'Android' : /Windows/.test(u) ? 'Windows' : /Mac/.test(u) ? 'Mac' : '기타';
  const br = /KAKAOTALK/i.test(u) ? '카톡' : /SamsungBrowser/.test(u) ? '삼성 인터넷' : /CriOS|Chrome/.test(u) ? '크롬' : /Safari/.test(u) ? '사파리' : '';
  return os + (br ? ' · ' + br : '');
}

function openApp() {
  $('pin').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = V.name + ' 님 · ' + V.role;
  buildTabs();
}

async function enter(pin) {
  PIN = pin;
  $('pinBtn').disabled = true; $('pinMsg').textContent = '확인 중이에요…';
  try {
    V = await call('login', $('remember').checked, deviceLabel());
    if (V.device) {
      PIN = 'd:' + V.device; NEWDEV = true;
      devSet(V.device);
    }
    openApp();
  } catch (e) {
    $('pinMsg').textContent = e.message || String(e);
    $('pinBtn').disabled = false;
  }
}

async function enterDevice() {
  PIN = 'd:' + DEV;
  $('pinMsg').textContent = '여는 중이에요…'; $('pinBtn').disabled = true;
  try { V = await call('login', false, ''); openApp(); }
  catch (e) {
    PIN = '';
    const m = e.message || String(e);
    if (m.indexOf('DEVICE') >= 0) devSet('');
    $('pinMsg').textContent = m.indexOf('DEVICE') >= 0 ? '이 기기 등록이 해제됐어요. 휴대폰 번호 뒷 4자리를 다시 넣어 주세요.' : m;
    $('pinBtn').disabled = false;
  }
}

function deviceBanner() {
  if (!NEWDEV) return '';
  return `<div class="card" style="border-color:#9ec5a9;background:#f1f8f3"><b>이 기기가 등록됐어요.</b>
    <div class="sub">지금 이 화면을 <b>홈 화면에 추가</b>하거나 즐겨찾기해 두면 다음부터 번호 없이 바로 열려요.
    (크롬: 오른쪽 위 ⋮ → 홈 화면에 추가 / 사파리: 공유 버튼 → 홈 화면에 추가)</div>
    <div class="row" style="margin-top:8px"><button class="btn line" onclick="NEWDEV=false;show(TAB)">알겠어요</button></div></div>`;
}

function buildTabs() {
  const tabs = V.role === '선생님'
    ? [['att', '출결'], ['tt', '전체 시간표'], ['notice', '공지']]
    : [['my', '내 수업'], ['fee', '회비'], ['tt', '시간표'], ['notice', '공지']];
  $('tabs').innerHTML = tabs.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.t));
  show(tabs[0][0]);
}

function show(t) {
  TAB = t;
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({ my: viewMy, fee: viewFee, tt: viewTT, notice: viewNotice, att: viewAtt })[t]();
  if (NEWDEV) $('view').insertAdjacentHTML('afterbegin', deviceBanner());
  window.scrollTo(0, 0);
}

function changeNote(c, date) {
  if (!c) return '';
  const d = md(date);
  if (c.type === '행사 휴강') return `<div class="alert">${d} 수업은 교회 행사로 쉬어요.</div>`;
  let s = '';
  if (c.place) s += `${d}은 장소가 <b>${esc(c.place)}</b>(으)로 바뀌어요. `;
  if (c.type === '대타 진행' && c.sub) s += `${esc(c.sub)} 선생님이 대신 수업해요.`;
  return s ? `<div class="alert">${s}</div>` : '';
}

/* ── 학부모·성인: 내 수업 ── */
function viewMy() {
  if (!V.students.length) { $('view').innerHTML = '<div class="card">연결된 학생이 없어요. 관리자에게 문의해 주세요.</div>'; return; }
  $('view').innerHTML = V.students.map((s, i) => {
    const st = s.status === '휴강' ? '<span class="badge warn">휴강 중</span>' : s.status === '그만둠 예정' ? '<span class="badge bad">그만둠 예정</span>' : '';
    const r = s.reply;
    let reply = '';
    if (r && r.answer === '계속') reply = `<p class="sub">"계속"으로 답하셨어요.</p>`;
    if (r && r.answer === '그만둠') reply = r.locked
      ? `<p class="sub">"그만둠"으로 확정됐어요. 변경은 관리자에게 문의해 주세요.</p>`
      : `<p class="sub">"그만둠"으로 답하셨어요. ${esc(r.until)}까지는 "계속"으로 바꿀 수 있어요.</p>`;
    const replyBtns = (r && r.locked) ? '' : `<div class="row">
        <button class="btn" onclick="reply(${i},'계속')">계속할게요</button>
        <button class="btn line" onclick="reply(${i},'그만둠')">그만둘게요</button></div>`;
    const change = s.changePending
      ? `<p class="sub">시간 변경을 신청하셨어요. 먼저 기다리고 계신 분이 있으면 변경까지 시간이 걸릴 수 있어요. 자리가 나면 바로 알려드릴게요.</p>`
      : (s.options.length ? `<button class="btn line" onclick="openChange(${i})">시간 변경 신청</button><div id="chg${i}"></div>` : '<p class="sub">옮길 수 있는 다른 시간이 없어요.</p>');
    return `<div class="card">
      <h2>${esc(s.name)} ${st}</h2>
      <div>${esc(s.inst)} · ${esc(s.teacher)} 선생님</div>
      <div>매주 토요일 <b>${esc(s.slot)}</b> · ${esc(s.place)}</div>
      ${changeNote(s.change, V.date)}
      <p class="sub" style="margin:8px 0 0">같은 반: ${s.classmates.length ? s.classmates.map(esc).join(', ') : '없음'}</p>
      <h3>${ym(V.month)}에도 수업을 계속할까요?</h3>${reply}${replyBtns}
      <h3>시간 변경</h3>${change}
    </div>`;
  }).join('');
}

async function reply(i, ans) {
  const s = V.students[i];
  if (ans === '그만둠' && !confirm(`${s.name} 학생이 ${ym(V.month)}부터 그만두는 걸로 답할까요?\n7일 안에는 다시 "계속"으로 바꿀 수 있어요.`)) return;
  try { toast(await call('saveReply', s.id, ans)); await refresh(); } catch (e) { toast(e.message || e); }
}

function openChange(i) {
  const s = V.students[i];
  $('chg' + i).innerHTML = `<label>옮기고 싶은 시간</label>
    <select id="opt${i}">${s.options.map((o, j) => `<option value="${j}">${esc(o.teacher)} 선생님 · ${esc(o.slot)}</option>`).join('')}</select>
    <label>남기실 말씀 (선택)</label><textarea id="memo${i}" rows="2"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="sendChange(${i})">신청하기</button></div>
    <p class="sub">신청해도 지금 수업은 그대로 계속 들으실 수 있어요.</p>`;
}

async function sendChange(i) {
  const s = V.students[i], o = s.options[Number($('opt' + i).value)];
  try { toast(await call('requestChange', s.id, o.teacher, o.slot, $('memo' + i).value)); await refresh(); } catch (e) { toast(e.message || e); }
}

/* ── 학부모·성인: 회비 ── */
function viewFee() {
  const cls = st => st === '완납' ? 'ok' : st === '일부 납부' ? 'warn' : 'bad';
  $('view').innerHTML = (V.payInfo ? `<div class="card"><h2>입금 안내</h2><div>${esc(V.payInfo)}</div></div>` : '') +
    V.students.map(s => `<div class="card"><h2>${esc(s.name)}</h2>${s.fees.length ? `<table>
      <tr><th>월</th><th class="num">청구</th><th class="num">납부</th><th>상태</th></tr>
      ${s.fees.map(f => `<tr><td>${ym(f.month)}</td><td class="num">${won(f.total)}</td><td class="num">${won(f.paid)}</td>
        <td><span class="badge ${cls(f.status)}">${esc(f.status)}</span>${f.due ? `<div class="sub">${won(f.due)} 남음</div>` : ''}</td></tr>`).join('')}
      </table>` : '<p class="sub">청구 내역이 아직 없어요.</p>'}</div>`).join('');
}

/* ── 공통: 시간표 ── */
function viewTT() {
  const teacher = V.role === '선생님';
  $('view').innerHTML = `<p class="sub">${md(V.date)} 토요일 기준</p>` + V.timetable.map(t => `<div class="card">
    <h2>${esc(t.teacher)} <span class="sub">${esc(t.inst)} · ${esc(t.place)}</span></h2>
    ${t.slots.map(s => `<div class="slot">
      <div><b>${esc(s.slot)}</b> ${teacher ? `<span class="badge ${s.free > 0 ? 'ok' : ''}">빈자리 ${s.free} / ${s.cap}</span>` : ''}</div>
      ${changeNote(s.change, V.date)}
      <div class="names">${s.people.length ? s.people.map(p => teacher
        ? esc(p.name) + (p.status !== '수강' ? `<span class="badge warn">${esc(p.status)}</span>` : '')
        : `<span class="${p.mine ? 'mine' : ''}">${esc(p.name)}</span>`).join(', ') : '<span class="sub">아직 없음</span>'}</div>
    </div>`).join('')}
  </div>`).join('') || '<div class="card">시간표가 비어 있어요.</div>';
}

/* ── 공통: 공지 ── */
function viewNotice() {
  $('view').innerHTML = V.notices.length ? V.notices.map(n => `<div class="card">
    <h2>${esc(n.title)}</h2><p class="sub">${esc(n.posted)}${n.date ? ' · 관련 날짜 ' + esc(n.date) : ''}</p>
    <div style="white-space:pre-wrap">${esc(n.body)}</div></div>`).join('') : '<div class="card">공지가 없어요.</div>';
}

/* ── 선생님: 출결 ── */
function viewAtt() {
  $('view').innerHTML = `<div class="card">
    <label>수업 날짜</label><input type="date" id="attDate" value="${esc(V.date)}">
    <label>수업 선생님 (대신 들어가시는 날엔 원래 선생님을 고르세요)</label>
    <select id="attT">${V.teachers.map(t => `<option ${t === V.name ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="loadClass()">명단 불러오기</button></div>
  </div><div id="cls"></div>`;
  loadClass();
}

let CLS = [];
async function loadClass() {
  $('cls').innerHTML = '<p class="sub">불러오는 중…</p>';
  try {
    CLS = await call('getClass', $('attDate').value, $('attT').value);
    $('cls').innerHTML = CLS.length ? CLS.map((c, i) => `<div class="card">
      <h2>${esc(c.slot)} <span class="sub">${esc(c.place)}</span></h2>${changeNote(c.change, $('attDate').value)}
      ${c.students.length ? c.students.map((s, j) => `<div class="att"><span>${esc(s.name)}</span>
        <div class="seg">${['출석', '결석', '지각'].map(v => `<button data-v="${v}" class="${s.att === v ? 'on' : ''}" onclick="mark(${i},${j},'${v}')">${v}</button>`).join('')}</div></div>`).join('')
        + `<div class="row" style="margin-top:10px"><button class="btn line" onclick="allIn(${i})">모두 출석</button><button class="btn" onclick="saveAtt(${i})">저장</button></div>`
        : '<p class="sub">수강 중인 학생이 없어요.</p>'}
    </div>`).join('') : '<div class="card">이 선생님은 개설된 수업이 없어요.</div>';
  } catch (e) { $('cls').innerHTML = ''; toast(e.message || e); }
}
function paint(i) {
  const card = $('cls').children[i];
  card.querySelectorAll('.att').forEach((row, j) => row.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === CLS[i].students[j].att)));
}
function mark(i, j, v) { CLS[i].students[j].att = v; paint(i); }
function allIn(i) { CLS[i].students.forEach(s => s.att = '출석'); paint(i); }
async function saveAtt(i) {
  const c = CLS[i], list = c.students.filter(s => s.att).map(s => ({ id: s.id, att: s.att }));
  if (!list.length) { toast('출결을 먼저 눌러 주세요.'); return; }
  try { toast(await call('saveAttendance', $('attDate').value, $('attT').value, c.slot, list)); } catch (e) { toast(e.message || e); }
}

async function refresh() { V = await call('login'); show(TAB); }

/* ── 시작 ── */
if (!KEY) {
  $('pinMsg').textContent = '관리자에게 받은 개인 링크로 접속해 주세요.';
  $('pinInput').classList.add('hidden'); $('pinBtn').classList.add('hidden');
} else {
  $('pinBtn').onclick = () => { const p = $('pinInput').value.trim(); if (/^\d{4}$/.test(p)) enter(p); else $('pinMsg').textContent = '숫자 4자리를 입력해 주세요.'; };
  $('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('pinBtn').click(); });
  if (DEV) enterDevice();
}
</script>
</body>
</html>
